<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Menu Viewer | Not Your Mama's Kitchen</title>
    <style>
        /* Typography - Exact brand fonts referenced from root */
        @font-face { font-family: 'Century Gothic'; src: url('/century-gothic-regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Century Gothic'; src: url('/century-gothic-bold.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
        @font-face { font-family: 'bernard-mt-condensed-regular'; src: url('/bernard-mt-condensed-regular.ttf') format('truetype'); font-display: swap; }

        :root {
            --brand-red: #95201d;
            --brand-gold: #c8a96a;
            --dark-bg: #0d0d0d;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Century Gothic', Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            padding: 30px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--dark-bg));
        }

        .brand-bar {
            height: 4px;
            width: 80px;
            background: linear-gradient(90deg, var(--brand-red), var(--brand-gold));
            margin: 0 auto 15px;
            border-radius: 2px;
        }

        h1 {
            font-family: 'bernard-mt-condensed-regular', serif;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--brand-gold);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Canvas & Overlays */
        #viewport {
            display: flex;
            justify-content: center;
            padding-bottom: 40px;
        }

        #canvas-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            background: #000;
        }

        canvas {
            display: block;
        }

        .dish-overlay {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* background: rgba(255,0,0,0.1); /* Use this for debugging overlay positioning */
        }

        /* States */
        #loading {
            padding: 100px 20px;
            font-size: 1.1rem;
            color: var(--brand-gold);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(200, 169, 106, 0.1);
            border-top: 3px solid var(--brand-gold);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer {
            padding: 30px 20px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-bar"></div>
        <h1>Not Your Mama's Kitchen</h1>
        <p class="tagline">Authentic Southern Soul Food</p>
    </header>

    <main id="viewport">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading the Menu...</p>
        </div>
        <div id="canvas-wrapper" style="display:none">
            <canvas id="menu-canvas"></canvas>
            <div id="overlay-container"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Not Your Mama's Kitchen &mdash; Menu updated live</p>
        <p id="last-updated"></p>
    </footer>

    <script>
        const BASE_W = 908.44;
        const BASE_H = 1336.02;
        const API_URL = '/api/menu';
        const POLL_INTERVAL = 30000;
        const BG_PATH = '/menu-bg-preview.jpg';

        const canvas = document.getElementById('menu-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const overlayContainer = document.getElementById('overlay-container');
        const loading = document.getElementById('loading');

        let lastDataHash = null;
        let menuData = null;
        let bgImg = null;
        let cachedImages = {};

        async function init() {
            try {
                // Preload Background
                bgImg = await preloadImage(BG_PATH);
                await fetchAndDraw();
                
                // Polling
                setInterval(fetchAndDraw, POLL_INTERVAL);
                window.addEventListener('resize', () => { if(menuData) draw(menuData); });
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        async function fetchAndDraw() {
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const currentHash = JSON.stringify(data.elements || []);
                if (currentHash === lastDataHash) return;
                
                lastDataHash = currentHash;
                menuData = data;
                
                // Preload all unique images in the menu
                const uniqueImages = [...new Set((data.elements || [])
                    .filter(el => el.type === 'image')
                    .map(el => el.src || (el.assetId ? `/Images/${el.assetId}.png` : '')))];
                
                for (const src of uniqueImages) {
                    if (src && !cachedImages[src]) {
                        cachedImages[src] = await preloadImage(src);
                    }
                }

                await draw(data);
                
                loading.style.display = 'none';
                wrapper.style.display = 'inline-block';
                
                if (data.status && data.status.last_saved) {
                    document.getElementById('last-updated').textContent = `Last Sync: ${data.status.last_saved}`;
                }
            } catch (err) {
                console.error("Menu update failed:", err);
            }
        }

        async function draw(data) {
            // 1. Font Preload Confirmation
            await Promise.race([
                Promise.all([
                    document.fonts.load('1em Century Gothic'),
                    document.fonts.load('bold 1em Century Gothic'),
                    document.fonts.load('1em bernard-mt-condensed-regular')
                ]),
                new Promise(resolve => setTimeout(resolve, 800))
            ]);

            // 2. Setup Dimensions
            const scale = window.innerWidth / BASE_W;
            // Use Math.min to prevent canvas being larger than 800px on high-res desktops for standard viewing, 
            // but for mobile we want innerWidth. Let's cap at 1000px centered.
            const displayWidth = Math.min(window.innerWidth, 1000);
            const actualScale = displayWidth / BASE_W;
            
            canvas.width = displayWidth;
            canvas.height = BASE_H * actualScale;

            // 3. Clear and Draw Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }

            // 4. Draw Elements in order
            const elements = (data.elements || [])
                .filter(el => el.visible !== false)
                .sort((a, b) => (a.zIndex || 10) - (b.zIndex || 10));

            overlayContainer.innerHTML = ''; // Clear overlays

            elements.forEach(el => {
                const s = actualScale;
                const style = el.style || {};

                if (el.type === 'text') {
                    const fontSize = (style.fontSize || 16);
                    const weight = style.fontWeight || 'normal';
                    const family = style.fontFamily || 'Century Gothic';
                    
                    // Helper to translate editor family names to our @font-face names
                    let fontStack = `${weight} ${fontSize * s}px "${family}"`;
                    if (family.toLowerCase().includes('condensed')) fontStack = `${fontSize * s}px "bernard-mt-condensed-regular"`;
                    if (family.toLowerCase().includes('century')) fontStack = `${weight} ${fontSize * s}px "Century Gothic"`;

                    ctx.font = fontStack;
                    ctx.fillStyle = style.color || '#000000';
                    ctx.textAlign = style.textAlign || 'left';
                    ctx.textBaseline = 'top';

                    const lines = (el.text || '').split('\n');
                    const lineHeight = (style.lineHeight || 1.1) * (fontSize * s);
                    
                    lines.forEach((line, idx) => {
                        ctx.fillText(line, el.x * s, (el.y * s) + (idx * lineHeight));
                    });

                    // 5. Create Overlays
                    const overlay = document.createElement('div');
                    overlay.className = 'dish-overlay';
                    overlay.dataset.elementId = el.id;
                    Object.assign(overlay.style, {
                        left: (el.x * s) + 'px',
                        top: (el.y * s) + 'px',
                        width: (el.width ? el.width * s : 100) + 'px',
                        height: (el.height ? el.height * s : fontSize * s) + 'px'
                    });
                    overlayContainer.appendChild(overlay);

                } else if (el.type === 'image') {
                    const src = el.src || (el.assetId ? `/Images/${el.assetId}.png` : '');
                    if (cachedImages[src]) {
                        ctx.save();
                        // Round corners if specified
                        if (el.cornerRadius) {
                            const rad = el.cornerRadius * s;
                            ctx.beginPath();
                            ctx.roundRect(el.x * s, el.y * s, el.width * s, el.height * s, rad);
                            ctx.clip();
                        }
                        ctx.drawImage(cachedImages[src], el.x * s, el.y * s, el.width * s, el.height * s);
                        ctx.restore();
                    }
                }
            });
        }

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        // Run
        init();
    </script>
</body>
</html>
