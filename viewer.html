<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Menu Viewer | Not Your Mama's Kitchen</title>
    <style>
        /* Typography - Exact brand fonts referenced from root */
        @font-face { font-family: 'Century Gothic'; src: url('/century-gothic-regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Century Gothic'; src: url('/century-gothic-bold.ttf') format('truetype'); font-weight: bold; font-style: normal; font-display: swap; }
        @font-face { font-family: 'bernard-mt-condensed-regular'; src: url('/bernard-mt-condensed-regular.ttf') format('truetype'); font-display: swap; }

        :root {
            --brand-red: #95201d;
            --brand-gold: #c8a96a;
            --dark-bg: #0d0d0d;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Century Gothic', Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            padding: 30px 20px;
            background: linear-gradient(to bottom, #1a1a1a, var(--dark-bg));
        }

        .brand-bar {
            height: 4px;
            width: 80px;
            background: linear-gradient(90deg, var(--brand-red), var(--brand-gold));
            margin: 0 auto 15px;
            border-radius: 2px;
        }

        h1 {
            font-family: 'bernard-mt-condensed-regular', serif;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--brand-gold);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Canvas & Overlays */
        #viewport {
            display: flex;
            justify-content: center;
            padding-bottom: 40px;
        }

        #canvas-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            background: #000;
        }

        canvas {
            display: block;
        }

        .dish-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none; /* Only video overlays will set this to auto */
            background: transparent !important;
        }

        /* Video Popup Backdrop */
        #video-popup-backdrop {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75);
            z-index: 9998;
            display: none;
            backdrop-filter: blur(4px);
        }

        /* Mobile Tap Badge */
        .video-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            bottom: auto;
            left: auto;
            background: rgba(0,0,0,0.75);
            color: #c8a96a;
            border: 1px solid #c8a96a;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: bold;
            pointer-events: none;
            width: fit-content;
            max-width: 40px;
            white-space: nowrap;
            line-height: 1.4;
            z-index: 25;
            display: none; /* Shown only on mobile via JS */
        }

        /* Video Popup Styles */
        #video-popup {
            position: fixed;
            z-index: 9999;
            background: rgba(0,0,0,0.92);
            border: 2px solid #c8a96a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8), 0 0 20px rgba(200,169,106,0.3);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 280px;
            transition: opacity 0.2s ease;
            pointer-events: auto;
        }
        #video-popup.visible { display: flex; }
        #popup-video {
            width: 256px;
            height: 256px;
            object-fit: cover;
            border-radius: 10px;
        }
        #video-popup-close {
            position: absolute;
            top: 8px; right: 10px;
            background: none;
            border: none;
            color: #c8a96a;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }
        #video-popup-label {
            color: #c8a96a;
            font-family: 'Century Gothic', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* States */
        #loading {
            padding: 100px 20px;
            font-size: 1.1rem;
            color: var(--brand-gold);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(200, 169, 106, 0.1);
            border-top: 3px solid var(--brand-gold);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        footer {
            padding: 30px 20px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-bar"></div>
        <h1>Not Your Mama's Kitchen</h1>
        <p class="tagline">Authentic Southern Soul Food</p>
    </header>

    <main id="viewport">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading the Menu...</p>
        </div>
        <div id="canvas-wrapper" style="display:none">
            <canvas id="menu-canvas"></canvas>
            <div id="overlay-container"></div>
        </div>

        <!-- Shared Video Popup & Backdrop -->
        <div id="video-popup-backdrop" onclick="hideVideoPopup()"></div>
        <div id="video-popup">
            <button id="video-popup-close" onclick="hideVideoPopup()">✕</button>
            <video id="popup-video" muted loop playsinline></video>
            <div id="video-popup-label"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Not Your Mama's Kitchen &mdash; Menu updated live</p>
        <p id="last-updated"></p>
    </footer>

    <script>
        const BASE_W = 908.44;
        const BASE_H = 1336.02;
        const API_URL = '/api/menu';
        const POLL_INTERVAL = 30000;
        const BG_PATH = '/menu-bg-preview.jpg';

        const canvas = document.getElementById('menu-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const overlayContainer = document.getElementById('overlay-container');
        const loading = document.getElementById('loading');

        let lastDataHash = null;
        let menuData = null;
        let bgImg = null;
        let cachedImages = {};

        async function init() {
            try {
                // Preload Background
                bgImg = await preloadImage(BG_PATH);
                await fetchAndDraw();
                
                // Polling
                setInterval(fetchAndDraw, POLL_INTERVAL);
                window.addEventListener('resize', () => { if(menuData) draw(menuData); });
            } catch (err) {
                console.error("Initialization failed:", err);
            }
        }

        async function fetchAndDraw() {
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const currentHash = JSON.stringify(data.elements || []);
                if (currentHash === lastDataHash) return;
                
                lastDataHash = currentHash;
                menuData = data;
                
                // Preload all unique images in the menu
                const uniqueImages = [...new Set((data.elements || [])
                    .filter(el => el.type === 'image')
                    .map(el => el.src || (el.assetId ? `/Images/${el.assetId}.png` : '')))];
                
                for (const src of uniqueImages) {
                    if (src && !cachedImages[src]) {
                        cachedImages[src] = await preloadImage(src);
                    }
                }

                await draw(data);
                
                loading.style.display = 'none';
                wrapper.style.display = 'inline-block';
                
                if (data.status && data.status.last_saved) {
                    document.getElementById('last-updated').textContent = `Last Sync: ${data.status.last_saved}`;
                }
            } catch (err) {
                console.error("Menu update failed:", err);
            }
        }

        async function draw(data) {
            // 1. Font Preload Confirmation
            await Promise.race([
                Promise.all([
                    document.fonts.load('1em Century Gothic'),
                    document.fonts.load('bold 1em Century Gothic'),
                    document.fonts.load('1em bernard-mt-condensed-regular')
                ]),
                new Promise(resolve => setTimeout(resolve, 800))
            ]);

            // 2. Setup Dimensions
            const dpr = window.devicePixelRatio || 1;
            const displayWidth = Math.min(window.innerWidth, 1000);
            const scale = displayWidth / BASE_W;
            const displayHeight = BASE_H * scale;

            // Set canvas physical pixel size (sharp on retina/mobile)
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            // Set canvas CSS display size
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
            // Scale context to match DPR + menu scale
            ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

            // 3. Clear and Draw Background
            ctx.clearRect(0, 0, BASE_W, BASE_H);
            if (bgImg) {
                ctx.drawImage(bgImg, 0, 0, BASE_W, BASE_H);
            }

            // 4. Draw Elements in order
            const elements = (data.elements || [])
                .filter(el => el.visible !== false)
                .sort((a, b) => (a.zIndex || 10) - (b.zIndex || 10));

            overlayContainer.innerHTML = ''; // Clear overlays

            elements.forEach(el => {
                const style = el.style || {};

                if (el.type === 'text') {
                    const fontSize = (style.fontSize || 16);
                    const weight = style.fontWeight || 'normal';
                    const family = style.fontFamily || 'Century Gothic';
                    
                    let fontStack = `${weight} ${fontSize}px "${family}"`;
                    if (family.toLowerCase().includes('condensed')) fontStack = `${fontSize}px "bernard-mt-condensed-regular"`;
                    if (family.toLowerCase().includes('century')) fontStack = `${weight} ${fontSize}px "Century Gothic"`;

                    ctx.font = fontStack;
                    ctx.fillStyle = style.color || '#000000';
                    ctx.textAlign = style.textAlign || 'left';
                    ctx.textBaseline = 'top';

                    const lines = (el.text || '').split('\n');
                    const lineHeight = (style.lineHeight || 1.1) * fontSize;
                    
                    lines.forEach((line, idx) => {
                        ctx.fillText(line, el.x, el.y + (idx * lineHeight));
                    });
                } else if (el.type === 'image') {
                    const src = el.src || (el.assetId ? `/Images/${el.assetId}.png` : '');
                    if (cachedImages[src]) {
                        ctx.save();
                        if (el.cornerRadius) {
                            const rad = el.cornerRadius;
                            ctx.beginPath();
                            ctx.roundRect(el.x, el.y, el.width, el.height, rad);
                            ctx.clip();
                        }
                        ctx.drawImage(cachedImages[src], el.x, el.y, el.width, el.height);
                        ctx.restore();
                    }
                }

                // 5. Create Overlays (ONLY for items with videoUrl)
                if (el.videoUrl) {
                    const overlay = document.createElement('div');
                    overlay.className = 'dish-overlay';
                    overlay.dataset.elementId = el.id;
                    
                    // Priority: dishName > label > text > id
                    const labelText = el.dishName || el.label || el.text || el.id;

                    Object.assign(overlay.style, {
                        left: (el.x * scale) + 'px',
                        top: (el.y * scale) + 'px',
                        width: ((el.width || 100) * scale) + 'px',
                        height: ((el.height || (el.style?.fontSize || 20) * 1.5) * scale) + 'px',
                        pointerEvents: 'auto',
                        cursor: 'pointer'
                    });

                    overlay.dataset.videoUrl = el.videoUrl;
                    overlay.dataset.content = labelText;

                    if (isMobile()) {
                        // Add "TAP" Badge for clarity on mobile
                        const badge = document.createElement('div');
                        badge.className = 'video-badge';
                        badge.style.display = 'block';
                        badge.innerText = '▶ TAP';
                        overlay.appendChild(badge);

                        overlay.addEventListener('touchend', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            showVideoPopup(el.videoUrl, labelText, 0, 0);
                        }, { passive: false });

                        // Fallback for Android Chrome
                        overlay.addEventListener('click', (e) => {
                            e.stopPropagation();
                            showVideoPopup(el.videoUrl, labelText, 0, 0);
                        });
                    } else {
                        overlay.addEventListener('mouseenter', (e) => {
                            showVideoPopup(el.videoUrl, labelText, e.clientX, e.clientY);
                        });
                        overlay.addEventListener('mousemove', (e) => {
                            positionPopup(document.getElementById('video-popup'), e.clientX, e.clientY);
                        });
                        overlay.addEventListener('mouseleave', () => {
                            setTimeout(hideVideoPopup, 300);
                        });
                    }
                    overlayContainer.appendChild(overlay);
                }
            });
        }

        // Phase 2: Popup Logic
        const isMobile = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;

        function showVideoPopup(videoUrl, elementContent, mouseX, mouseY) {
            const video = document.getElementById('popup-video');
            const popup = document.getElementById('video-popup');
            const backdrop = document.getElementById('video-popup-backdrop');
            const label = document.getElementById('video-popup-label');
            
            // iOS Compatibility: Set attributes before src
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            
            if (video.src !== videoUrl) {
                video.src = videoUrl;
                video.load();
            }
            
            // Delay play() slightly for iOS/Safari stability
            setTimeout(() => {
                video.play().catch(() => {});
            }, 100);

            label.textContent = elementContent || '';
            
            popup.classList.add('visible');
            if (isMobile()) backdrop.style.display = 'block';
            
            requestAnimationFrame(() => positionPopup(popup, mouseX, mouseY));
        }

        function hideVideoPopup() {
            const popup = document.getElementById('video-popup');
            const video = document.getElementById('popup-video');
            const backdrop = document.getElementById('video-popup-backdrop');
            
            popup.classList.remove('visible');
            backdrop.style.display = 'none';
            
            video.pause();
            video.removeAttribute('src'); // Completely free the resource
            video.load();
        }

        function positionPopup(popup, mouseX, mouseY) {
            if (isMobile()) {
                // Centered for mobile
                popup.style.left = '50%';
                popup.style.top = '50%';
                popup.style.transform = 'translate(-50%, -50%)';
                return;
            }

            const offset = 20;
            let x = mouseX + offset;
            let y = mouseY - popup.offsetHeight - offset;

            // Flip if off-screen (Right)
            if (x + popup.offsetWidth > window.innerWidth) {
                x = mouseX - popup.offsetWidth - offset;
            }
            // Flip if off-screen (Top)
            if (y < 0) {
                y = mouseY + offset;
            }

            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            popup.style.transform = 'none';
        }

        // Global Close on Background Click
        window.addEventListener('click', (e) => {
            const popup = document.getElementById('video-popup');
            if (popup.classList.contains('visible') && !popup.contains(e.target)) {
                hideVideoPopup();
            }
        });

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        // Run
        init();
    </script>
</body>
</html>
