<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MENU EDITOR PRO V2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #161616;
            --accent: #c8a96a;
            --text: #e0e0e0;
            --border: #2a2a2a;
            --header-h: 110px; /* Increased for double-row ribbon */
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER & TOP RIBBON */
        header {
            height: var(--header-h);
            background: #000;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .header-top {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #222;
        }

        .top-ribbon {
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .top-ribbon::-webkit-scrollbar { display: none; }

        .ribbon-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border-right: 1px solid #333;
            height: 40px;
        }
        .ribbon-group:last-child { border-right: none; }
        .ribbon-label {
            font-size: 10px;
            color: #666;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .logo { font-weight: 900; letter-spacing: 1px; color: var(--accent); font-size: 14px; }

        /* PANELS */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #left-panel {
            width: 200px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        #right-panel {
            width: 320px;
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        #canvas-container {
            position: relative;
            background: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform-origin: center center;
        }

        canvas { display: block; }

        /* FLOATING BARS - CLEAN SLATE */
        #selection-bar {
            position: fixed;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 8px;
            display: none;
            z-index: 5000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            align-items: center;
            gap: 12px;
            min-width: 200px;
            max-width: 90vw;
            user-select: none;
            /* Reset all fixed positions */
            left: 50%;
            top: 70%;
            transform: translate(-50%, -50%);
        }

        .bar-tab {
            padding: 6px 12px;
            font-size: 10px;
            font-weight: 800;
            color: #666;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .bar-tab.active { background: var(--accent); color: #000; }

        .ctrl-group { display: flex; align-items: center; gap: 8px; }
        .ctrl-group label { font-size: 10px; color: #888; font-weight: bold; }

        .ctrl-btn {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .ctrl-btn:hover { background: #333; border-color: var(--accent); }
        .ctrl-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        select, input[type="number"] {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        /* UI BUTTONS */
        .btn-ui {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-ui:hover { background: #333; border-color: var(--accent); }
        .btn-ui.primary { background: var(--accent); color: #000; border: none; }

        /* TABS */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 12px; text-align: center; font-size: 11px; font-weight: 800; cursor: pointer; color: #666; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .panel-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* ASSETS */
        .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .asset-item { 
            background: #222; 
            border-radius: 8px; 
            aspect-ratio: 1; 
            overflow: hidden; 
            cursor: pointer; 
            position: relative;
            border: 2px solid transparent;
        }
        .asset-item:hover { border-color: var(--accent); }
        .asset-item img { width: 100%; height: 100%; object-fit: cover; }

        /* HELPERS */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo">MENU EDITOR PRO V2</div>
        <div style="display:flex; gap:10px;">
            <button class="btn-ui primary" onclick="saveSession()"><i class="fas fa-save"></i> Save Session</button>
            <button class="btn-ui" onclick="undo()"><i class="fas fa-undo"></i> Undo</button>
            <button class="btn-ui" id="btn-lock-layout" onclick="toggleLayoutLock()" style="background:#c0392b;"><i class="fas fa-lock"></i> Layout Locked</button>
            <button class="btn-ui" onclick="location.reload()"><i class="fas fa-sync"></i> RELOAD</button>
        </div>
    </div>
    
    <!-- TOP RIBBON: WORD-STYLE TYPOGRAPHY & ALIGNMENT -->
    <div class="top-ribbon" id="top-ribbon">
        <!-- FONT GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Font</span>
            <select id="ribbon-font" style="width:160px" onchange="updateStyle('fontFamily', this.value)">
                <option value="bernard-mt-condensed-regular">Bernard MT Condensed</option>
                <option value="century-gothic-bold">Century Gothic Bold</option>
                <option value="century-gothic-regular">Century Gothic Regular</option>
            </select>
            <input type="number" id="ribbon-size" min="8" max="500" style="width:60px" onchange="updateStyle('fontSize', parseFloat(this.value))">
            <input type="color" id="ribbon-color" oninput="updateStyle('color', this.value)">
        </div>

        <!-- STYLE GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Style</span>
            <button class="ctrl-btn" id="ribbon-bold" onclick="toggleStyle('fontWeight', 'bold', 'normal')"><b>B</b></button>
            <button class="ctrl-btn" id="ribbon-italic" onclick="toggleStyle('fontStyle', 'italic', 'normal')"><i>I</i></button>
            <button class="ctrl-btn" id="ribbon-underline" onclick="toggleStyle('textDecoration', 'underline', 'none')"><u>U</u></button>
        </div>

        <!-- ALIGN GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Align</span>
            <button class="ctrl-btn" onclick="updateStyle('textAlign', 'left')"><i class="fas fa-align-left"></i></button>
            <button class="ctrl-btn" onclick="updateStyle('textAlign', 'center')"><i class="fas fa-align-center"></i></button>
            <button class="ctrl-btn" onclick="updateStyle('textAlign', 'right')"><i class="fas fa-align-right"></i></button>
        </div>

        <!-- CASE GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Case</span>
            <button class="ctrl-btn" onclick="toggleCase('uppercase')" style="font-size:10px">AA</button>
            <button class="ctrl-btn" onclick="toggleCase('lowercase')" style="font-size:10px">aa</button>
        </div>

        <!-- SPACING GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Spacing</span>
            <div class="ctrl-group"><label>H</label><input type="number" id="ribbon-height" step="0.1" style="width:45px" onchange="updateStyle('lineHeight', parseFloat(this.value))"></div>
            <div class="ctrl-group"><label>W</label><input type="number" id="ribbon-spacing" style="width:45px" onchange="updateStyle('letterSpacing', parseInt(this.value))"></div>
        </div>

        <!-- DISTRIBUTE GROUP -->
        <div class="ribbon-group">
            <span class="ribbon-label">Distribute</span>
            <button class="btn-ui" style="padding:4px 8px; font-size:10px" onclick="distributeVertically()">↕ Dist V</button>
            <button class="btn-ui" style="padding:4px 8px; font-size:10px" onclick="distributeHorizontally()">↔ Dist H</button>
        </div>
    </div>
</header>

<div class="main-container">
    <div id="left-panel">
        <div class="tabs">
            <div class="tab active" onclick="setLeftTab('add')"><i class="fas fa-plus"></i><br>ADD</div>
            <div class="tab" onclick="setLeftTab('assets')"><i class="fas fa-images"></i><br>ASSETS</div>
            <div class="tab" onclick="setLeftTab('layers')"><i class="fas fa-layer-group"></i><br>LAYERS</div>
        </div>
        <div class="panel-content" id="left-content">
            <!-- Content dynamically loaded -->
        </div>
    </div>

    <div class="canvas-area" id="canvas-area">
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
        </div>
    </div>

    <div id="right-panel">
        <div class="tabs">
            <div class="tab active" onclick="setRightTab('viewer')"><i class="fas fa-globe"></i><br>VIEWER</div>
            <div class="tab" onclick="setRightTab('manual')"><i class="fas fa-book"></i><br>MANUAL</div>
            <div class="tab" onclick="setRightTab('ai')"><i class="fas fa-magic"></i><br>AI STUDIO</div>
        </div>
        <div class="panel-content" id="right-content">
            <!-- Content dynamically loaded -->
        </div>
    </div>
</div>

<!-- SELECTION BAR: ULTRA-LIGHT & FREE-FLOAT -->
<div id="selection-bar">
    <div id="bar-handle">⠿</div>
    
    <div style="display:flex; gap:6px; margin-right:10px;">
        <div class="bar-tab active" id="tab-layer" onclick="setBarTab('layer')">LAYER</div>
        <div class="bar-tab" id="tab-arrange" onclick="setBarTab('arrange')">ARRANGE</div>
    </div>

    <div id="bar-content" style="display:flex; align-items:center; gap:12px;">
        <!-- LAYER TAB -->
        <div id="bar-tab-layer" style="display:flex; align-items:center; gap:10px;">
            <button class="ctrl-btn" id="ctrl-lock" onclick="toggleItemLock()">🔓</button>
            <button class="ctrl-btn" id="ctrl-visible" onclick="toggleVisibility()">👁️</button>
            <div class="ctrl-group"><label>Role</label><select id="sel-role" onchange="updateProp('layerRole', this.value)"><option value="content">Content</option><option value="background">Background</option><option value="overlay">Overlay</option></select></div>
            <div class="ctrl-group"><label>Opac</label><input type="range" id="sel-opacity" min="0" max="100" style="width:50px" oninput="updateProp('opacity', this.value/100)"></div>
            <div class="ctrl-group"><label>Rot</label><input type="range" id="sel-rotate" min="0" max="359" style="width:50px" oninput="updateProp('rotation', parseInt(this.value))"></div>
        </div>

        <!-- ARRANGE TAB -->
        <div id="bar-tab-arrange" style="display:none; align-items:center; gap:10px;">
            <button class="ctrl-btn" onclick="arrange('top')" title="Front">⇈</button>
            <button class="ctrl-btn" onclick="arrange('up')" title="Up">↑</button>
            <button class="ctrl-btn" onclick="arrange('down')" title="Down">↓</button>
            <button class="ctrl-btn" onclick="arrange('bottom')" title="Back">⇊</button>
            <div class="ctrl-group">
                <button class="btn-ui" style="padding:4px 8px; font-size:10px" onclick="centerElement('h')">C-H</button>
                <button class="btn-ui" style="padding:4px 8px; font-size:10px" onclick="centerElement('v')">C-V</button>
            </div>
            <button class="btn-ui" style="padding:4px 8px; font-size:10px; background:#c0392b; color:#fff; border:none;" onclick="deleteSelected()"><i class="fas fa-trash"></i></button>
        </div>
    </div>
</div>

<script>
    // CORE STATE
    let docV2 = { elements: [], assets: [], settings: { viewer: {} } };
    let selectedIds = [];
    let isDraggingBar = false;
    let barOffset = { x: 0, y: 0 };

    // SELECTION BAR DRAG - CLEAN SLATE
    const selBar = document.getElementById('selection-bar');
    const barHandle = document.getElementById('bar-handle');

    barHandle.addEventListener('mousedown', (e) => {
        isDraggingBar = true;
        const rect = selBar.getBoundingClientRect();
        barOffset.x = e.clientX - rect.left;
        barOffset.y = e.clientY - rect.top;
        selBar.style.cursor = 'grabbing';
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDraggingBar) return;
        // FREE FLOAT: Update top/left directly with no constraints
        selBar.style.left = (e.clientX - barOffset.x) + 'px';
        selBar.style.top = (e.clientY - barOffset.y) + 'px';
        selBar.style.transform = 'none'; // Prevent centering conflicts
    });

    window.addEventListener('mouseup', () => {
        isDraggingBar = false;
        selBar.style.cursor = 'default';
    });

    // MOCK FUNCTIONS (TO BE CONNECTED TO MAIN LOGIC)
    function setBarTab(tab) {
        document.querySelectorAll('.bar-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('bar-tab-layer').style.display = (tab === 'layer') ? 'flex' : 'none';
        document.getElementById('bar-tab-arrange').style.display = (tab === 'arrange') ? 'flex' : 'none';
    }

    // INITIALIZATION
    window.onload = () => {
        console.log("App Initialized");
        // loadData();
    };
</script>

</body>
</html>
